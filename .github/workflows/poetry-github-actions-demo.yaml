name: Python CI/CD Workflow

# Trigger the workflow on push to any branch
on:
  push:
    branches:
      - '*'  # Triggers on any branch

jobs:
  test-build-execute:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10.8'  # Specific Python version

      # Step 3: Install Poetry (if not already installed)
      - name: Install Poetry
        run: |
          pip install poetry

      # Step 4: Install dependencies using Poetry
      - name: Install dependencies
        run: |
          poetry install
          poetry sync

      # Step 5: Run unit tests
      - name: Run unit tests
        run: |
          python -m pytest  # Replace with your test command if different

      # Step 6: Build and execute your Python code
      - name: Build and execute
        run: |
          poetry run python -V  # Verify Python version
          poetry build  # Build the project using Poetry