name: Python CI/CD Workflow

# Trigger the workflow on push to the feature branch
on:
  push:
    branches:
      - '*'  # Replace with your feature branch name

jobs:
  test-build-execute:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Set up Python
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10.8'  # Replace with your Python version (e.g., 3.9)

      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          poetry install
          poetry sync

      # Step 4: Run unit tests
      - name: Run unit tests
        run: |
          python -m pytest  # Replace with your test command if different

      # Step 5: Build and execute your Python code
      - name: Build and execute
        run: |
          poetry run python -V
          # Add your build commands here (if any)
          # Example: python setup.py build

          # Execute your Python script
          poetry build  # Replace with your script name